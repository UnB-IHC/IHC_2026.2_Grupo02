site_name: Guia Prático de IHC
site_description: Guia de Interacao Humano-Computador, usabilidade, design centrado em pessoas e acessibilidade digital.
site_url: https://unb-ihc.github.io/IHC_2026.2_Grupo02/
docs_dir: manual-ihc
site_dir: site-guia-ihc

theme:
  name: material
  language: pt
  font:
    text: Poppins
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Ativar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Ativar tema claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Inicio: index.md
  - Sobre os autores: autores.md
  - "Capítulo 1 — Fundamentos de IHC, UX e UI": fundamentos.md
  - "Capítulo 2 — Usabilidade, carga mental e cognição": usabilidade.md
  - "Capítulo 3 — UCD e design empático": design-centrado.md
  - "Capítulo 4 — Acessibilidade digital: ferramentas": acessibilidade.md
  - "Capítulo 5 — Acessibilidade digital: normas (WCAG/NBR)": normas-acessibilidade.md
  - "Capítulo 6 — Service Blueprint": blueprint.md
  - "Capítulo 7 — Teste de usabilidade com usuário real": teste-usabilidade.md
  - Referencias e escopo: referencias.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/guia.css

extra_javascript:
  - javascripts/guia.js
